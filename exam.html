<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#003b66" />
  <title>NEET PG CBT - Exam</title>

  <style>
    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 52px;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    .topbar {
      background: #003b66;
      color: white;
      min-height: 34px;
      padding: 7px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 310px;
      min-height: calc(100vh - 34px);
    }

    .main {
      min-width: 0;
      padding: 15px 45px;
      background: #ffffff;
    }

    .qbox { max-width: 950px; }

    .student-info {
      font-size: 13px;
      margin-bottom: 10px;
      line-height: 1.5;
      color: #333;
    }

    .qtitle {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 15px;
      scroll-margin-top: 52px;
    }

    .qtext {
      background: #f7f7f7;
      padding: 12px;
      border-radius: 4px;
      line-height: 1.45;
      font-size: 15px;
      margin-bottom: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .media-status {
      display: none;
      padding: 12px;
      margin: 12px 0;
      background: #eef3f9;
      border: 1px solid #d6dce5;
      border-radius: 6px;
      color: #003b66;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }

    .qimg {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      display: block;
      margin: 12px auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: zoom-in;
      background: #ffffff;
    }

    .qvideo {
      width: 100%;
      max-height: 520px;
      display: block;
      margin: 12px auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #000000;
    }

    .opts { margin-top: 10px; }

    .opt {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 14px;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;

      /* Allow vertical page scrolling on touch screens. */
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
    }

    .opt:hover { background: #f6f8fb; }

    .opt.selected {
      background: #dbeafe;
      border-color: #003b66;
      font-weight: bold;
    }

    .opt input[type="radio"] {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin: 1px 0 0;
      accent-color: #0057d9;
      cursor: pointer;
    }

    .optText {
      flex: 1 1 auto;
      min-width: 0;
      overflow-wrap: anywhere;
      user-select: text;
      -webkit-user-select: text;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button {
      background: #003b66;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 9px 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      touch-action: manipulation;
    }

    button:hover { opacity: 0.9; }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.danger { background: #c40035; }

    .palette {
      background: #f3f5fa;
      border-left: 1px solid #d6dce5;
      padding: 25px 18px;
      min-height: calc(100vh - 34px);
      position: sticky;
      top: 34px;
      max-height: calc(100vh - 34px);
      overflow-y: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .palette h3 {
      margin: 0 0 16px 0;
      font-size: 20px;
    }

    #pal {
      display: grid;
      grid-template-columns: repeat(6, 38px);
      gap: 10px;
      align-items: center;
    }

    #pal button {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: bold;
      color: #111;
      background: #dbe3e7;
    }

    #pal button.current {
      outline: 3px solid #000;
      outline-offset: 2px;
    }

    #pal button.unanswered {
      background: #dbe3e7;
      color: #111;
    }

    #pal button.answered {
      background: #2e7d32;
      color: white;
    }

    #pal button.review {
      background: #7b1fa2;
      color: white;
    }

    #pal button.ansreview {
      background: #0d70b7;
      color: white;
    }

    .legend {
      margin-top: 16px;
      font-size: 13px;
    }

    .legend div {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 13px;
      height: 13px;
      display: inline-block;
      border-radius: 3px;
    }

    .dot.unanswered { background: #dbe3e7; }
    .dot.answered { background: #2e7d32; }
    .dot.review { background: #7b1fa2; }
    .dot.ansreview { background: #0d70b7; }

    .warning {
      color: #c62828;
      font-weight: bold;
      margin-top: 14px;
      font-size: 14px;
    }

    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9999;
    }

    .img-modal.show { display: block; }

    .img-modal-top {
      height: 55px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding: 10px;
    }

    .img-modal-body {
      height: calc(100vh - 55px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .img-modal-body img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      html { scroll-padding-top: 54px; }

      .topbar {
        min-height: 36px;
        font-size: 13px;
        padding: 8px 10px;
        gap: 8px;
      }

      .layout { display: block; }

      .main { padding: 12px; }

      .qtext { font-size: 14px; }

      .qimg,
      .qvideo,
      #qImgWrap img {
        max-height: 360px;
      }

      .opt {
        font-size: 14px;
        padding: 12px 10px;
        min-height: 44px;
      }

      .actions { gap: 6px; }

      .actions button {
        padding: 9px 10px;
        font-size: 12px;
      }

      .palette {
        border-left: none;
        border-top: 1px solid #d6dce5;
        min-height: auto;
        padding: 18px 12px;
        position: static;
        max-height: 55vh;
        overflow-y: auto;
        scroll-behavior: smooth;
      }

      #pal {
        grid-template-columns: repeat(6, 42px);
        gap: 9px;
      }

      #pal button {
        width: 42px;
        height: 42px;
        font-size: 13px;
      }
    }

    @media (max-width: 380px) {
      #pal { grid-template-columns: repeat(5, 42px); }

      .topbar { font-size: 11px; }
    }

    #qImgWrap img {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      display: block;
      margin: 12px auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: zoom-in;
      background: #fff;
    }

    #imgModalPic {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    .student-info { margin-bottom: 10px; }
    .schedule-info { font-size: 12px; font-weight: normal; }
  </style>
</head>

<body>
  <header class="topbar">
    <div>
      NEET PG CBT
      <span class="schedule-info"> | IST: <span id="istClock">--</span></span>
    </div>

    <div>
      Time Left: <b id="timeLeft">60:00</b>
      &nbsp; | &nbsp;
      Violations: <b id="vio">0</b>
    </div>
  </header>

  <div class="layout">
    <main class="main">
      <div class="qbox">
        <div class="student-info" id="studentInfo"></div>

        <div class="student-info schedule-info">
          Exam window:
          <span id="examStartIST">--</span>
          to
          <span id="examEndIST">--</span>
        </div>

        <div id="qTitle" class="qtitle">Loading examination...</div>
        <div id="qText" class="qtext"></div>
        <div id="qImgWrap"></div>
        <div id="opts" class="opts"></div>

        <div class="actions">
          <button id="prevBtn" type="button" disabled>Previous</button>
          <button id="clearBtn" type="button" disabled>Clear Response</button>
          <button id="markBtn" type="button" disabled>Mark for Review</button>
          <button id="nextBtn" type="button" disabled>Next</button>
        </div>

        <div class="actions">
          <button id="submitBtn" class="danger" type="button" disabled>
            Submit
          </button>
        </div>

        <div class="warning" id="warning"></div>
      </div>
    </main>

    <aside class="palette" id="paletteBox">
      <h3>Questions</h3>
      <div id="pal"></div>

      <div class="legend">
        <div><span class="dot unanswered"></span> Unanswered</div>
        <div><span class="dot answered"></span> Answered</div>
        <div><span class="dot review"></span> Marked</div>
        <div><span class="dot ansreview"></span> Answered + Marked</div>
      </div>
    </aside>
  </div>

  <div id="imgModal" class="img-modal" aria-hidden="true">
    <div class="img-modal-top">
      <button id="imgFullBtn" type="button">Fullscreen</button>
      <button id="imgCloseBtn" class="danger" type="button">Close</button>
    </div>

    <div class="img-modal-body">
      <img id="imgModalPic" alt="Question image enlarged" />
    </div>
  </div>

  <!-- Load configuration first, then the single secure exam controller. -->
  <!-- Do not add questions.js or any client-side answer-key script here. -->
  <script src="config.js?v=20261108c"></script>
  <script src="exam.js?v=20261108c"></script>
</body>
</html>
